[package]
name = "cheek"
version = "0.2.2"
edition = "2024"
description = "Fast media downloads in Rust: parallel ranged HTTP, HLS, ffmpeg merge, yt-dlp compatible"
license = "Unlicense"
repository = "https://github.com/Mailo037/cheek"
readme = "README.md"
keywords = ["yt-dlp", "downloader", "video", "hls", "android"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "gzip", "brotli", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tempfile = "3"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
